# Chargement hebdomadaire des référentiels RNCP et RS (France compétences, data.gouv.fr) dans la base du centre,
# puis lecture du détail des compétences des titres professionnels (REAC).
# Écrit uniquement dans les tables referentiel_* (fiches, blocs, chargements, documents, competences).
# Secret à créer par le responsable du centre : SUPABASE_SERVICE_ROLE_KEY (Settings > Secrets and variables > Actions).
name: Référentiels RNCP et RS
on:
  schedule:
    - cron: "17 5 * * 1"      # lundi 05:17 UTC, avant la veille du lundi
  workflow_dispatch:
    inputs:
      etape:
        description: "Que lancer ?"
        type: choice
        options: [tout, detail-competences]
        default: tout
      numero:
        description: "Détail des compétences : une seule fiche (ex. RNCP42431), vide = toutes"
        required: false
        default: ""
      forcer:
        description: "Relire tous les documents, même inchangés"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  charger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Charger les référentiels
        if: ${{ github.event_name == 'schedule' || inputs.etape == 'tout' }}
        run: |
          URL=$(grep -oP '"SUPABASE_URL":\s*"\K[^"]+' config.js)
          python3 outils/charger_referentiel.py --url "$URL"
      - name: Détail des compétences (REAC)
        run: |
          URL=$(grep -oP '"SUPABASE_URL":\s*"\K[^"]+' config.js)
          if [ -n "${{ inputs.numero }}" ]; then python3 outils/extraire_reac.py --url "$URL" --numero "${{ inputs.numero }}" --forcer
          elif [ "${{ inputs.forcer }}" = "true" ]; then python3 outils/extraire_reac.py --url "$URL" --forcer
          else python3 outils/extraire_reac.py --url "$URL"; fi
